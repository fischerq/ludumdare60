# Keeps every open PR merged with main, so none sits in conflict between Claude sessions.
# For each open PR from this repo: merge origin/main into its branch with tools/sync_main.py --ci (generated
# making-of files are regenerated, never conflict) and push. A real conflict is left alone and gets one comment
# on the PR; the next Claude session on that branch resolves it (UserPromptSubmit / pre-push hooks).
name: Sync open PRs with main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-prs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge main into each open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MARKER='<!-- sync-prs-conflict -->'
          gh pr list --state open --base main --json number,headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefName)"' |
          while read -r num branch; do
            echo "::group::#$num $branch"
            git fetch -q origin "$branch"
            git checkout -q -B "$branch" "origin/$branch"
            if python3 tools/sync_main.py --ci; then
              if [ "$(git rev-list --count "origin/$branch..HEAD")" != "0" ]; then
                git push -q origin "$branch" && echo "merged main into $branch"
              else
                echo "already up to date"
              fi
            elif ! gh pr view "$num" --json comments --jq '.comments[].body' | grep -qF "$MARKER"; then
              gh pr comment "$num" --body "$MARKER
          main changed and now conflicts with this branch in files that need a human (or Claude) decision. The next Claude session on this branch merges main and resolves it; or run \`python3 tools/sync_main.py --push\` locally.

          ---
          _Generated by the sync-prs workflow_"
            fi
            git reset -q --hard && git checkout -q --detach
            echo "::endgroup::"
          done
