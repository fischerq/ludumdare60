# Static site: no build step, publish the repo root as-is.
[build]
  publish = "."
  command = ""

# Always revalidate so phones pick up the latest push.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/making-of/*"
  [headers.values]
    Cache-Control = "no-cache"
