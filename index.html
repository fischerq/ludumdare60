<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Layers of Pac</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/press-start-2p@5.0.20/index.css">
  <!-- The service manual (src/manual/): a worn typewriter face for headings, Courier Prime for the text. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/special-elite@5.2.8/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/courier-prime@5.2.8/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/courier-prime@5.2.8/700.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #mute {
      position: fixed;
      right: calc(8px + env(safe-area-inset-right));
      top: calc(8px + env(safe-area-inset-top));
      width: 48px;
      height: 48px;
      padding: 0;
      border: 2px solid rgba(255, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font: 18px "Press Start 2P", monospace;
      opacity: 0.7;
      z-index: 10;
    }
    #game {
      position: fixed;
      inset: 0;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <button id="mute" aria-label="Sound on or off"></button>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script>
    // iOS Safari ignores user-scalable=no for pinch and double-tap; block those gestures directly.
    ['gesturestart', 'gesturechange', 'dblclick'].forEach((t) =>
      document.addEventListener(t, (e) => e.preventDefault(), { passive: false }));
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
