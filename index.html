<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Layers of Pac</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/press-start-2p@5.0.20/index.css" media="print" onload="this.media='all'">
  <!-- The service manual (src/manual/): a worn typewriter face for headings, Courier Prime for the text. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/special-elite@5.2.8/index.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/courier-prime@5.2.8/index.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/courier-prime@5.2.8/700.css" media="print" onload="this.media='all'">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #mute {
      position: fixed;
      right: calc(8px + env(safe-area-inset-right));
      top: calc(8px + env(safe-area-inset-top));
      width: 48px;
      height: 48px;
      padding: 0;
      border: 2px solid rgba(255, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font: 18px "Press Start 2P", monospace;
      opacity: 0.7;
      z-index: 10;
    }
    #game {
      position: fixed;
      inset: 0;
    }
    /* Boot screen: an arcade power-on self test, plain HTML so it shows before Phaser has downloaded. */
    #boot {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #000;
      color: #fff;
      font: 20px/1.6 "Press Start 2P", monospace;
      transition: opacity 0.25s;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot-lines { width: min(70vw, 360px); white-space: pre; }
    #boot-lines .ok { color: #ffe600; } /* the title yellow, COLORS.textReady in src/config.js */
    #boot-bar {
      width: min(70vw, 360px);
      height: 20px;
      border: 3px solid #2121de;
      padding: 3px;
    }
    #boot-fill {
      height: 100%;
      width: 0;
      background: #ffff00;
      transition: width 0.2s;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="boot"><div id="boot-lines"></div><div id="boot-bar"><div id="boot-fill"></div></div></div>
  <button id="mute" aria-label="Sound on or off"></button>
  <script>
    // Boot screen: one self-test line per layer below the maze; the newest line is the one being "tested".
    // The bar runs through three phases (Phaser and the game's modules, the art, building the textures and the
    // emulated machine), each given the share of the bar it takes in time, so the bar fills evenly and every
    // line is the newest for the same time. Shares measured on a cold load with Chrome's 4G throttling and 4x
    // CPU slowdown (~4.1 s, ~7.2 s, ~0.2 s). Until Phaser has arrived (it can't report progress) the bar creeps
    // through the first phase, timed by `creepTime` (s to reach 90 % of it).
    window.bootScreen = (() => {
      const ITEMS = ['SCREEN', 'VIDEO', 'RAM', 'BUS', 'CPU', 'LOGIC', 'INPUT'];
      const PHASES = { code: [0, 0.36], art: [0.36, 0.98], machine: [0.98, 1] };
      const creepTime = 4;
      const lines = document.getElementById('boot-lines'), fill = document.getElementById('boot-fill');
      let shown = 0, listed = 0;
      // Line k (of n) appears when the bar passes k/n, the first one right away.
      const set = (f) => {
        shown = Math.max(shown, Math.min(1, f));
        fill.style.width = `${shown * 100}%`;
        while (listed < ITEMS.length && shown >= listed / ITEMS.length) {
          const el = document.createElement('div');
          el.innerHTML = `${ITEMS[listed++].padEnd(8)}<span class="ok">OK</span>`;
          lines.appendChild(el);
        }
      };
      const at = (phase, p) => { const [a, b] = PHASES[phase]; return a + (b - a) * Math.min(1, Math.max(0, p)); };
      const t0 = performance.now();
      const k = Math.log(10) / creepTime;
      const timer = setInterval(() => set(at('code', 1 - Math.exp(-k * (performance.now() - t0) / 1000))), 100);
      set(0);
      return {
        // phase: 'code', 'art' or 'machine'; p: 0..1 through it.
        progress(phase, p) { clearInterval(timer); set(at(phase, p)); },
        done() {
          clearInterval(timer); set(1);
          const boot = document.getElementById('boot');
          boot.classList.add('done');
          setTimeout(() => boot.remove(), 300);
        },
      };
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js" defer></script>
  <script>
    // iOS Safari ignores user-scalable=no for pinch and double-tap; block those gestures directly.
    ['gesturestart', 'gesturechange', 'dblclick'].forEach((t) =>
      document.addEventListener(t, (e) => e.preventDefault(), { passive: false }));
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
